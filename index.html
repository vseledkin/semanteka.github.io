<!DOCTYPE html>
<html lang="en" data-theme="system">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Semanteka</title>
  <link rel="icon" href="semanteka-32.png" type="image/png" sizes="32x32">
  <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-MWGS9WHH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
  </script>
  <script>
    {
      const root = document.documentElement;
      const preferenceKey = 'semanteka.theme';

      try {
        const savedTheme = localStorage.getItem(preferenceKey);
        if (['light', 'dark', 'system'].includes(savedTheme)) {
          root.dataset.theme = savedTheme;
        }
      } catch {
        // The switch still works when storage is unavailable.
      }

      document.addEventListener('DOMContentLoaded', () => {
        const themeSwitch = document.querySelector('.theme-switch');
        themeSwitch.querySelector(`[value="${root.dataset.theme}"]`).checked = true;
        themeSwitch.addEventListener('change', (event) => {
          const theme = event.target.value;
          root.dataset.theme = theme;
          try {
            localStorage.setItem(preferenceKey, theme);
          } catch {
            // Keep the current selection for this page.
          }
        });
        themeSwitch.hidden = false;
      });
    }
  </script>
  <link rel="stylesheet" href="style.css">
  <script src="plane.js" defer></script>
</head>

<body>
  <div class="floating-toolbar theme-switch" role="radiogroup" aria-label="Appearance" hidden>
    <svg class="floating-toolbar-art" viewBox="0 0 132 52" aria-hidden="true">
      <defs>
        <linearGradient id="toolbar-face" x2="0%" y2="100%">
          <stop offset="0%"></stop>
          <stop offset="100%"></stop>
        </linearGradient>
        <linearGradient id="theme-selection" x2="0%" y2="100%">
          <stop offset="0%"></stop>
          <stop offset="100%"></stop>
        </linearGradient>
        <g id="toolbar-frame">
          <rect class="toolbar-rim" x="2" y="2" height="46" rx="23" fill="url(#toolbar-face)"></rect>
          <rect class="toolbar-track" x="7" y="7" height="36" rx="18"></rect>
        </g>
      </defs>
      <use href="#toolbar-frame"></use>
      <circle class="theme-thumb" cx="66" cy="25" r="18" fill="url(#theme-selection)"></circle>

      <g class="toolbar-icon theme-icon-light" transform="translate(14 13)">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
      </g>
      <g class="toolbar-icon theme-icon-dark" transform="translate(54 13)">
        <path d="M20.99 12.79A9 9 0 0 1 11.21 3a9 9 0 1 0 9.78 9.79Z"></path>
      </g>
      <g class="toolbar-icon theme-icon-system" transform="translate(94 13)">
        <rect x="2" y="3" width="20" height="14" rx="2"></rect>
        <path d="M12 17v4m-4 0h8"></path>
      </g>
    </svg>
    <label title="Light">
      <input id="theme-light" type="radio" name="theme" value="light" aria-label="Light" autocomplete="off">
    </label>
    <label title="Dark">
      <input id="theme-dark" type="radio" name="theme" value="dark" aria-label="Dark" autocomplete="off">
    </label>
    <label title="System">
      <input id="theme-system" type="radio" name="theme" value="system" aria-label="System" autocomplete="off" checked>
    </label>
  </div>
  <main class="plane" tabindex="0" aria-labelledby="wordmark" aria-describedby="plane-instructions">
    <h1 id="wordmark" class="wordmark" aria-label="Semanteka"><img class="wordmark-initial" src="semanteka-128.png"
        width="128" height="128" alt="" draggable="false">emanteka</h1>
    <p id="plane-instructions" class="visually-hidden">
      Drag to pan. Scroll or pinch to zoom. Use the arrow keys to pan, plus or minus to zoom, and zero to reset.
    </p>
  </main>
  <div class="floating-toolbar zoom-toolbar" role="group" aria-label="Zoom controls" hidden>
    <svg class="floating-toolbar-art" viewBox="0 0 188 52" aria-hidden="true">
      <use href="#toolbar-frame"></use>
    </svg>
    <button type="button" data-zoom="in" aria-label="Zoom in" title="Zoom in">
      <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 12h14m-7-7v14"></path>
      </svg>
    </button>
    <output class="zoom-level" aria-label="Current zoom" aria-live="off">100%</output>
    <button type="button" data-zoom="out" aria-label="Zoom out" title="Zoom out">
      <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 12h14"></path>
      </svg>
    </button>
    <button type="button" data-zoom="reset" aria-label="Reset zoom and center" title="Reset zoom and center">
      <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3m0 8v3a2 2 0 0 1-2 2h-3m-8 0H5a2 2 0 0 1-2-2v-3"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
    </button>
  </div>
</body>

</html>
